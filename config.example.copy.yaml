env: dev
workspace: .
project:
  name: demo-service
  root: .
  language: java
  default_branch: master
  test_command: 'mvn "-DargLine=-XX:+EnableDynamicAgentLoading -Xshare:off" test'
  lint_command: ""  # 示例: "javac -Xlint:all -d /tmp/auto-fix-lint {file}"
llm:
  base_url: https://api.openai.com/v1
  api_key: your-api-key
  model:
  timeout_seconds: 60
  # 备用 LLM：主 LLM 调用失败时自动切换
  # fallback_provider: deepseek
  # fallback_base_url: ""
  # fallback_api_key: sk-your-fallback-key
  # fallback_model: deepseek-chat
gitee:
  base_url: https://gitee.com/api/v5
  token: your-gitee-token
  owner: your-owner
  repo: your-repo
feishu:
  webhook: ""
  app_id: ""
  app_secret: ""
  approval_chat_id: ""
session:
  root_dir: ./data/sessions
  retention_days: 7
agent:
  name: auto-fix-agent
  max_retry: 3
  reflection_enabled: true
  review_required: true
  watch_paths:
    - ./logs

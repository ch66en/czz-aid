env: dev
workspace: .

project:
  name: default-project
  root: .
  language: java
  default_branch: main
  compile_command: mvn compile
  test_command: 'mvn "-DargLine=-XX:+EnableDynamicAgentLoading -Xshare:off" test'
  lint_command: ""

llm:
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  api_key: your-api-key
  model: your-model-name
  timeout_seconds: 60
  fallback_provider: ""
  fallback_base_url: ""
  fallback_api_key: ""
  fallback_model: ""

compact:
  enabled: true
  context_window_tokens: 1000000
  summary_max_output_tokens: 20000
  normal_output_reserve_tokens: 40000
  buffer_tokens: 100000
  max_ptl_retries: 3
  max_consecutive_failures: 3
  keep_recent_rounds: 8
  restore_max_files: 8
  restore_max_chars_per_file: 16000
  restore_total_chars: 80000

gitee:
  base_url: https://gitee.com/api/v5
  token: your-gitee-token
  owner: your-owner
  repo: your-repo

feishu:
  webhook: ""
  app_id: ""
  app_secret: ""
  approval_chat_id: ""
  review_callback_mode: local
  review_callback_host: 127.0.0.1
  review_callback_port: 8765
  review_callback_base_url: http://127.0.0.1:8765

feishu_knowledge:
  enabled: false
  app_id: ""
  app_secret: ""
  wiki_space_ids: []
  sync_interval_minutes: 60
  base_url: https://open.feishu.cn/open-apis

rag:
  enabled: true
  backend: sqlite
  db_path: ./data/sessions/agent.db
  auto_index_on_startup: false
  dynamic_tools_enabled: false
  debug_candidate_logging: false

  embedding_provider: fallback
  embedding_base_url: ""
  embedding_api_key: ""
  embedding_model: ""

  module_aliases:
    "com.example.order": order

  retrieval:
    bm25_weight: 1.2
    vector_weight: 1.0
    rrf_k: 60
    vector_min_score: 0.25
    skill_child_top_k: 20
    parent_skill_top_k: 3
    project_doc_recall_top_k: 20
    project_doc_final_top_k: 5
    candidate_top_n: 15
    per_doc_chunk_cap: 2

  context_synthesizer:
    enabled: true
    inherit_main_llm: true
    provider: ""
    base_url: ""
    api_key: ""
    model: ""
    timeout_seconds: 60
    max_output_tokens: 4000

session:
  backend: sqlite
  root_dir: ./data/sessions
  db_path: ./data/sessions/agent.db
  retention_days: 7

agent:
  name: auto-fix-agent
  max_retry: 3
  reflection_enabled: true
  review_required: true
  watch_paths:
    - ./logs
  debug: false
